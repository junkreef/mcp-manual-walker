[project]
name = "mcp-manual-walker"
version = "0.1.0"
description = "An MCP server to bridge the information gap between AI agents and PDF manuals."
authors = [
    { name = "Jules", email = "jules@example.com" },
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "markitdown",
    "pypdf",
    "SQLAlchemy",
    "pydantic",
    "pydantic-settings",
    "uuid7",
]

[project.optional-dependencies]
dev = [
    "uv",
    "ruff",
    "mypy"
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
package = true

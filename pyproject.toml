[project]
name = "mcp-manual-walker"
version = "0.1.0"
description = "An MCP server to bridge the information gap between AI agents and PDF manuals."
authors = [
    { name = "Junpei Kishi", email = "junkreef@longarch.net" },
    { name = "Jules", email = "jules@example.com" },
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "markitdown[pdf]",
    "pypdf",
    "SQLAlchemy",
    "pydantic",
    "pydantic-settings",
    "chromadb",
]

[project.optional-dependencies]
builder = [
    "docling",
    "langchain-text-splitters",
    "sentence-transformers",
]
dev = [
    "uv",
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "reportlab",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/mcp_manual_walker"]

[tool.coverage.report]
fail_under = 70
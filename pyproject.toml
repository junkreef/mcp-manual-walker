[project]
name = "mcp-manual-walker"
version = "0.1.0"
description = "An MCP server to bridge the information gap between AI agents and PDF manuals."
authors = [
    { name = "Junpei Kishi", email = "junkreef@longarch.net" },
    { name = "Jules", email = "jules@example.com" },
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "markitdown[pdf]",
    "pypdf",
    "SQLAlchemy",
    "pydantic",
    "pydantic-settings",
    "chromadb",
    "fastembed>=0.7.4",
]

[project.optional-dependencies]
builder = [
    "docling",
    "langchain-text-splitters",
    "sentence-transformers>=5.2.0",
    "torch>=2.0.0; sys_platform == 'linux'",
    "torchvision>=0.15.0; sys_platform == 'linux'",
]
dev = [
    "uv",
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "reportlab",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch" }]
torchvision = [{ index = "pytorch" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::ResourceWarning",
]

[tool.coverage.run]
source = ["src/mcp_manual_walker"]

[project.scripts]
db_manager = "mcp_manual_walker.db_manager:main"

[tool.coverage.report]
fail_under = 70

[project]
name = "mcp-manual-walker"
version = "0.1.0"
description = "An MCP server to bridge the information gap between AI agents and PDF manuals."
authors = [
    { name = "Junpei Kishi", email = "junkreef@longarch.net" },
    { name = "Jules", email = "jules@example.com" },
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "pypdf",
    "SQLAlchemy",
    "pydantic",
    "pydantic-settings",
    "chromadb",
    "rich",
    # The remote embedding backend talks to an OpenAI-compatible endpoint.
    # Already present as an mcp/fastmcp dependency, but embeddings imports it
    # directly.
    "httpx",
    # Compresses the chunk stream in an export archive. Already present as a
    # chromadb dependency, but db_manager imports it directly.
    "zstandard",
]

[project.optional-dependencies]
# The Qdrant backend (VECTOR_BACKEND=qdrant). Optional because Chroma is
# embedded and remains the right answer for a small corpus, and because this
# one needs a server to talk to.
qdrant = [
    "qdrant-client>=1.12",
]
# Embedding in this process. Not a base dependency, because it is the largest
# thing in the tree by far -- sentence-transformers drags in transformers and
# torch, and the container image built with it measures 2.43 GB against 905 MB
# without. A server running EMBEDDING_BACKEND=openai never loads a model, and
# embeddings.py imports sentence_transformers inside the constructor precisely
# so it can be absent. Included by `cpu` and `cu130`, which is what the builder
# and a self-contained server already ask for.
local-embeddings = [
    "sentence-transformers>=5.2.0",
]
# The torch build is chosen by extra: CPU wheels for the search server,
# CUDA 13.0 wheels for the builder. They are mutually exclusive.
cpu = [
    "mcp-manual-walker[local-embeddings]",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
cu130 = [
    "mcp-manual-walker[local-embeddings]",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
builder = [
    "mcp-manual-walker[cu130]",
    "docling>=2.120",
    "langchain-text-splitters",
]
dev = [
    "uv",
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "reportlab",
    # The Qdrant backend's tests run against a mocked client, so they need the
    # models it builds requests out of even when no server is around.
    "qdrant-client>=1.12",
    # The embedding tests inject a fake sentence_transformers module, so they
    # do not need the real one -- but `uv sync --extra dev` on its own should
    # still give a working local embedder.
    "mcp-manual-walker[local-embeddings]",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
package = true
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::ResourceWarning",
]

[tool.coverage.run]
source = ["src/mcp_manual_walker"]

[project.scripts]
db_manager = "mcp_manual_walker.db_manager:main"

[tool.coverage.report]
fail_under = 70

[project]
name = "mcp-manual-walker"
version = "0.1.0"
description = "An MCP server to bridge the information gap between AI agents and PDF manuals."
authors = [
    { name = "Junpei Kishi", email = "junkreef@longarch.net" },
    { name = "Jules", email = "jules@example.com" },
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "pypdf",
    "SQLAlchemy",
    "pydantic",
    "pydantic-settings",
    "chromadb",
    "sentence-transformers>=5.2.0",
]

[project.optional-dependencies]
# The torch build is chosen by extra: CPU wheels for the search server,
# CUDA 13.0 wheels for the builder. They are mutually exclusive.
cpu = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
cu130 = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
builder = [
    "mcp-manual-walker[cu130]",
    "docling",
    "langchain-text-splitters",
]
dev = [
    "uv",
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "reportlab",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
package = true
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::ResourceWarning",
]

[tool.coverage.run]
source = ["src/mcp_manual_walker"]

[project.scripts]
db_manager = "mcp_manual_walker.db_manager:main"

[tool.coverage.report]
fail_under = 70

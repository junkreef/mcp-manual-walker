# The search server and the vector database it talks to.
#
# This is a template, not the file compose reads. Ports, bind mounts, profiles
# and the user the containers run as all depend on the host, and once edited
# the file stops describing the project and starts describing one machine, so
# the copy is ignored by git and this original stays as the default to diff
# against:
#
#     cp compose.example.yaml compose.yaml
#
#   docker compose up -d --build
#       The server, embedding queries through an OpenAI-compatible endpoint.
#       Set EMBEDDING_API_BASE first (see .env.example).
#
#   docker compose --profile local up -d --build
#       The server with Qwen3-Embedding-0.6B in its own process instead. No
#       endpoint needed; a larger image and a model download on first use.
#
#   docker compose --profile tools run --rm db_manager import --input /app/data/corpus.zip
#       Any db_manager subcommand against the same databases.
#
# Everything persistent lives in one host directory -- ./data by default, the
# same place a non-container install puts it, so the two can share one database
# and a backup is a copy of a directory. MMW_DATA_DIR moves it elsewhere. That
# needs the containers to run as the user who owns that directory rather than
# as root; see MMW_UID below.
#
# The builder is deliberately absent. It wants a GPU, Docling's model
# downloads and several gigabytes of VRAM, and it runs once per corpus rather
# than continuously, so it belongs on the machine with the card. Build there
# and move the result with `db_manager export` / `import`, which is
# backend-neutral.

name: mcp-manual-walker

# Who the containers run as. The data directory is owned by whoever the
# install belongs to, and a container writing into it as root would leave
# files that user cannot delete. 1000:1000 is the first login account on most
# Linux systems; if that is not you, put MMW_UID and MMW_GID in a .env file
# beside this one:
#
#     printf 'MMW_UID=%s\nMMW_GID=%s\n' "$(id -u)" "$(id -g)" >> .env
#
# (UID cannot be used directly: bash marks it readonly and never exports it,
# so compose would not see it.)
x-run-as: &run-as "${MMW_UID:-1000}:${MMW_GID:-1000}"

x-app-env: &app-env
  VECTOR_BACKEND: qdrant
  QDRANT_URL: http://qdrant:6333
  QDRANT_GRPC_PORT: 6334
  # Both halves of a corpus have to agree about which model made the vectors,
  # so this is stated once and shared by the server and the tools.
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-remote-embedding: &remote-embedding
  EMBEDDING_BACKEND: openai
  EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:?set EMBEDDING_API_BASE, or use the "local" profile}
  EMBEDDING_API_MODEL: ${EMBEDDING_API_MODEL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}

# One host directory holds everything that has to survive the containers: the
# relational database (manuals, bookmarks, figures, the BM25 index, the
# recorded embedding model), the vectors under its qdrant/ subdirectory, and
# whatever archives and PDFs are being read. The SQLite half is not optional
# baggage -- a chunk id in Qdrant means nothing without it -- so the two belong
# in one directory and one backup.
#
# It defaults to ./data, which is where a non-container install puts it, so the
# two can share one database. Set MMW_DATA_DIR to an absolute path when the
# checkout is not the right home for the data -- a systemd install under /opt
# points it at /var/lib/mcp-manual-walker. Inside the container the path is
# always /app/data, so nothing else in the configuration changes.
x-app-volumes: &app-volumes
  - ${MMW_DATA_DIR:-./data}:/app/data

services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.19.1}
    restart: unless-stopped
    user: *run-as
    environment:
      # Qdrant's image runs as root and writes two things next to its binary
      # rather than into its storage: an init marker and a snapshots
      # directory. Running as anyone else then fails on /qdrant, which is
      # root-owned in the image, so both are pointed at the volume instead.
      QDRANT_INIT_FILE_PATH: /qdrant/storage/.qdrant-initialized
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
    volumes:
      - ${MMW_DATA_DIR:-./data}/qdrant:/qdrant/storage
    ports:
      # Loopback only. The server reaches Qdrant over the compose network, and
      # Qdrant has no authentication unless QDRANT__SERVICE__API_KEY is set;
      # publish it wider only once you have set one.
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      # The image carries no curl and no wget, but it does carry bash, and
      # /dev/tcp is enough to prove the port is answering.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # The default server: queries are embedded by somebody else's process, so
  # this image carries no torch and no model -- 905 MB against 2.43 GB. Where
  # the work happens changes what has to be installed here; whether it also
  # answers sooner depends on the two machines involved.
  mcp:
    build:
      context: .
      target: server-remote
    image: mcp-manual-walker:remote
    restart: unless-stopped
    user: *run-as
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      <<: [*app-env, *remote-embedding]
    volumes: *app-volumes
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8000}:8000"

  # The same server with the model in process. One or the other, never both:
  # they would fight over the port.
  mcp-local:
    profiles: ["local"]
    build:
      context: .
      target: server
    image: mcp-manual-walker:local
    restart: unless-stopped
    user: *run-as
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      <<: *app-env
      EMBEDDING_BACKEND: local
      # The image points this at the app user's home, which is the wrong place
      # once the container runs as somebody else. In the data directory it is
      # writable, visible and obviously excludable from a backup -- the weights
      # are ~1.2 GiB and can always be fetched again.
      HF_HOME: /app/data/model-cache
    volumes: *app-volumes
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8000}:8000"

  # One-off commands: import, export, delete, list, reindex-lexical. Uses the
  # small image, because none of those embed anything except `search`.
  db_manager:
    profiles: ["tools"]
    build:
      context: .
      target: server-remote
    image: mcp-manual-walker:remote
    user: *run-as
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      <<: *app-env
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-openai}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_API_MODEL: ${EMBEDDING_API_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    volumes: *app-volumes
    entrypoint: ["python", "-m", "mcp_manual_walker.db_manager"]

